<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPS</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <div class="flex h-screen overflow-hidden bg-slate-50">
        <aside id="sidebar" class="flex-shrink-0 w-[340px] overflow-hidden border-r border-slate-200 bg-white shadow-lg transition-all duration-300 ease-in-out">
            <div class="flex items-center justify-between gap-3 border-b border-slate-200 px-4 py-4">
                <div>
                    <p class="text-sm font-semibold uppercase tracking-[0.12em] text-slate-600">Control Panel</p>
                    <h1 class="text-xl font-semibold text-slate-900">Map Settings</h1>
                </div>
            </div>
            <div class="space-y-3 p-4">
                <input id="map-url" type="url" class="w-full rounded border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="url map" value="http://localhost:8080/">
                <input id="origin" type="text" class="w-full rounded border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="origin" value="">
                <input id="waypoints" type="text" class="w-full rounded border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="waypoints" value="">
                <input id="destination" type="text" class="w-full rounded border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="destination" value="">
                <input id="office-id" type="text" class="w-full rounded border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="office id" value="">
                <button id="btn_search" type="button" class="w-full rounded bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400">Search</button>
            </div>
        </aside>

        <main class="relative flex-1 overflow-hidden">
            <button id="sidebar-toggle" type="button" aria-label="Toggle sidebar" class="absolute left-4 top-4 z-[500] inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-lg transition hover:bg-slate-100 focus:outline-none">
                <span class="material-icons">chevron_left</span>
            </button>

            <div id="map" class="h-full"></div>
            <div id="routes" class="absolute top-5 left-5 z-40 hidden max-w-sm rounded-2xl border border-slate-300 bg-white p-4 shadow-xl space-y-3"></div>
            <div id="loading" style="display: none;" class="absolute inset-0 z-50 flex items-center justify-center bg-black/30">
                <div class="w-12 h-12">
                    <svg aria-hidden="true" class="w-full h-full text-gray-200 animate-spin fill-yellow-400" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
                    </svg>
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="src/main.js"></script>
</body>

</html>
